name: Release APKs

# Every release: push a tag like v0.3.37 and this workflow builds the APKs
# and publishes them directly to the GitHub Release for that tag.
# See docs/RELEASE.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release + upload APKs

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Privacy gate (release aborts on failure)
        run: |
          chmod +x scripts/privacy-check.sh
          ./scripts/privacy-check.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Decode release keystore (if secrets configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded from secrets."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret — release APK will use the debug key (labeled in notes)."
          fi

      - name: Ensure debug keystore exists (fallback signing)
        if: steps.keystore.outputs.present != 'true'
        run: |
          KS="$HOME/.android/debug.keystore"
          if [ ! -f "$KS" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Created fallback debug keystore at $KS"
          else
            echo "Runner already has a debug keystore at $KS"
          fi

      - name: Build APKs
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Rename APKs + checksums
        id: apks
        run: |
          TAG="${GITHUB_REF_NAME}"
          REL="app/build/outputs/apk/release/app-release.apk"
          DBG="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$REL" || { echo "missing $REL"; exit 1; }
          test -f "$DBG" || { echo "missing $DBG"; exit 1; }
          OUT="dist"
          mkdir -p "$OUT"
          REL_OUT="$OUT/T-Bone-fork-${TAG}-release.apk"
          DBG_OUT="$OUT/T-Bone-fork-${TAG}-debug.apk"
          cp "$REL" "$REL_OUT"
          cp "$DBG" "$DBG_OUT"
          (cd "$OUT" && sha256sum *.apk > SHA256SUMS.txt)
          cat "$OUT/SHA256SUMS.txt"
          echo "rel=$REL_OUT" >> "$GITHUB_OUTPUT"
          echo "dbg=$DBG_OUT" >> "$GITHUB_OUTPUT"

      - name: Release notes header
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            SIG="Signed with the repo owner's **release key** (stable update identity)."
          else
            SIG="Signed with the **debug key** (no KEYSTORE_* secrets configured). Fine for sideloading; set up a release key for stable updates — see docs/RELEASE.md."
          fi
          {
            echo "## T-Bone fork ${TAG}"
            echo ""
            echo "- Package: \`social.tbone.fork\` — installs **alongside** the original T-Bone (\`social.tbone\`)."
            echo "- ${SIG}"
            echo "- Privacy: no Google services, no tracking — enforced by CI privacy gate."
            echo ""
            echo "### Files"
            echo "- \`T-Bone-fork-${TAG}-release.apk\` — main APK (minify enabled)."
            echo "- \`T-Bone-fork-${TAG}-debug.apk\` — debug build for testers."
            echo "- \`SHA256SUMS.txt\` — verify with \`sha256sum -c SHA256SUMS.txt\`."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/T-Bone-fork-*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true
