name: Release signing identity diagnostic
on:
  push:
    branches: [arena-release-signing-diagnostic]
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compare public certificate fingerprint with prior release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.keystore"
          chmod 600 "$RUNNER_TEMP/signing.keystore"
          fingerprint=$(keytool -exportcert -keystore "$RUNNER_TEMP/signing.keystore" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)
          expected=0e37601f5716b1476b26a0aed023df97ca8c2ab0c1500cb2d3a7237337f65678
          echo "::notice::Configured signing certificate SHA-256: $fingerprint; v0.5.2 certificate SHA-256: $expected"
          if [ "$fingerprint" != "$expected" ]; then
            echo '::error::The configured signing key does not match the published v0.5.2 APK certificate.'
            exit 1
          fi
