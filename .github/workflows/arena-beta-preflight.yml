name: Signed beta preflight (no release)
on:
  push:
    branches: [arena-audit-verification]
permissions:
  contents: read
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Xmx3g -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvmargs="-Xmx1536m"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Version and privacy gates
        run: bash scripts/verify-release-version.sh && bash scripts/privacy-check.sh
      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do test -n "${!name}"; done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/beta.keystore"
          chmod 600 "$RUNNER_TEMP/beta.keystore"
      - name: Build and test signed beta and release variants
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/beta.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew :app:assembleBeta :app:testBetaUnitTest :app:assembleRelease :app:testReleaseUnitTest --stacktrace --no-configuration-cache > /tmp/beta-preflight.log 2>&1
          status=$?
          tail -200 /tmp/beta-preflight.log
          if [ "$status" -ne 0 ]; then
            grep -E '(^e:| FAILED|[0-9]+ tests completed|Compilation error|What went wrong)' /tmp/beta-preflight.log | head -35 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$status"
      - name: Verify beta identity and signing certificate
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/beta/app-beta.apk
          TOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$TOOLS" verify --verbose --print-certs "$APK" | tee /tmp/beta-signature.txt
          grep -Ei '^(Signer #1|V3\.0 Signer): certificate SHA-256 digest: 0e37601f5716b1476b26a0aed023df97ca8c2ab0c1500cb2d3a7237337f65678$' /tmp/beta-signature.txt
          "$(dirname "$TOOLS")/aapt" dump badging "$APK" | tee /tmp/beta-badging.txt
          grep "package: name='social.tbone.fork.beta' versionCode='70' versionName='0.5.4-beta'" /tmp/beta-badging.txt
          "$(dirname "$TOOLS")/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep "package: name='social.tbone.fork'"
          mkdir -p beta-preflight
          cp "$APK" beta-preflight/
          (cd beta-preflight && sha256sum app-beta.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: signed-beta-preflight
          path: beta-preflight/
          retention-days: 7
