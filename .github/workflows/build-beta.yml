name: Beta APK

# A push to beta with [build beta] in its commit message requests a build.
# Manual dispatch becomes available once this workflow is on the default branch.
on:
  push:
    branches: [beta]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also publish a public beta release (off = build artifacts only)'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/beta' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build beta]') || contains(github.event.head_commit.message, '[build artifacts]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy gate
        run: ./scripts/privacy-check.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Require and decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name Actions secret. See docs/RELEASE.md. Beta builds never use fallback debug signing."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/beta.keystore"
          chmod 600 "$RUNNER_TEMP/beta.keystore"
      - name: Build signed beta APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/beta.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx3g -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvmargs="-Xmx1536m"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-log"
          ./gradlew :app:assembleBeta --stacktrace --no-configuration-cache 2>&1 \
            | tee "$RUNNER_TEMP/ci-log/assemble.log"
          echo $? > "$RUNNER_TEMP/ci-log/assemble.exit"
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        env:
          GRADLE_OPTS: -Xmx3g -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvmargs="-Xmx1536m"
        run: |
          # pipefail is required: without it `tee` would supply the pipeline status
          # and a failing test run would look like a success.
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-log"
          # Capture the test run so failures are diagnosable from the ci-log branch
          # without access to the job log (which the Actions API gates to writers).
          ./gradlew :app:testBetaUnitTest --stacktrace --no-configuration-cache 2>&1 \
            | tee "$RUNNER_TEMP/ci-log/test.log"
      - name: Publish build log to ci-log branch (always)
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-log"
          cd "$RUNNER_TEMP/ci-log"
          # Keep the log small enough to live in git: the compiler errors are what
          # matters, not the full --stacktrace dump.
          { grep -nE '^(e: |w: .*error|FAILURE|\* What went wrong|> Task .* FAILED|Caused by)' assemble.log \
              || echo 'no compiler diagnostics matched'; } > diagnostics.txt || true
          tail -n 400 assemble.log > assemble.tail.log || true
          rm -f assemble.log
          if [ -f test.log ]; then
            { grep -nE '^(> Task .* FAILED|FAILURE|\* What went wrong|[a-zA-Z0-9_.]+ > .* FAILED|.*Exception|.*expected:.*)' test.log \
                || echo 'no test diagnostics matched'; } > test-diagnostics.txt || true
            tail -n 300 test.log > test.tail.log || true
            rm -f test.log
          fi
          echo "${{ github.sha }}" > sha.txt
          echo "run=${{ github.run_id }} attempt=${{ github.run_attempt }}" >> sha.txt
          git init -q
          git config user.email "ci@tbone.local"
          git config user.name "CI Logger"
          git add -A
          git commit -q -m "CI log for ${{ github.sha }}" || true
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:ci-log
      - name: Fail if unit tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "Unit tests failed; see test-diagnostics.txt on the ci-log branch."
          exit 1
      - name: Build and test production release variant
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/beta.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx3g -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvmargs="-Xmx1536m"
        run: |
          ./gradlew :app:assembleRelease :app:testReleaseUnitTest --stacktrace --no-configuration-cache
          TOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$TOOLS" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$(dirname "$TOOLS")/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep "package: name='social.tbone.fork'"
      - name: Verify identity, signature and checksum
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/beta/app-beta.apk
          test -f "$APK"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT="$(dirname "$TOOLS")/aapt"
          "$TOOLS" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/beta-signature.txt"
          grep -Ei '^(Signer #1|V3\.0 Signer): certificate SHA-256 digest: 0e37601f5716b1476b26a0aed023df97ca8c2ab0c1500cb2d3a7237337f65678$' "$RUNNER_TEMP/beta-signature.txt"
          "$AAPT" dump badging "$APK" | grep "package: name='social.tbone.fork.beta'"
          if "$AAPT" dump permissions "$APK" | grep -E 'android.permission.(BLUETOOTH_SCAN|BLUETOOTH_CONNECT|BLUETOOTH_ADVERTISE|NEARBY_WIFI_DEVICES|UWB_RANGING)'; then
            echo '::error::Nearby-device permission present in APK'
            exit 1
          fi
          mkdir -p beta-artifact
          cp "$APK" "beta-artifact/T-Bone-beta-${GITHUB_SHA:0:12}.apk"
          (cd beta-artifact && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: T-Bone-beta-${{ github.run_number }}
          path: beta-artifact/
          if-no-files-found: error
          retention-days: 90

      - name: Prepare beta release metadata
        if: contains(github.event.head_commit.message, '[build beta]') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        id: release
        run: |
          VERSION=$(sed -n 's/^versionName=//p' version.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=beta-${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Publish public beta
        if: contains(github.event.head_commit.message, '[build beta]') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: T-Bone beta ${{ steps.release.outputs.tag }}
          prerelease: true
          body: |
            Public beta for testing. Package: `social.tbone.fork.beta` (installed alongside the public release).

            - Removes Webxdc mini apps and migrates app-owned files and settings. Browser data cleanup may require an updated Android System WebView; the app reports and retries incomplete cleanup. Previously exported or shared copies remain outside the app.
            - Improves account recovery, note saves, list handling, links, accessibility and media lifecycle; clarifies metadata and Tor upload limitations.
            - Duress wiping is not forensic erasure, and Tor settings do not establish a universal network kill switch. Physical-device upgrade, TalkBack, process-death and live-network checks remain outstanding.
          files: |
            beta-artifact/*.apk
            beta-artifact/SHA256SUMS.txt
          fail_on_unmatched_files: true
