name: T-bone
summary: A bare-bones, Google-free Nostr client for Android
description: |
  T-bone is a bare-bones Nostr client for Android — no Google Services, no
  analytics, no tracking. Your private key never touches the app; signing is
  always handled by an external signer like Amber. Identity is shown as
  human-readable word phrases derived from your pubkey rather than truncated
  hex strings.

  This privacy fork (social.tbone.fork) installs side-by-side with the
  original T-Bone, keeps the 100% privacy-focused / fully-open-source stance
  with CI enforcement, and publishes every release automatically from GitHub
  tags. Inline images with in-app viewer, real avatars, full notification
  center, encrypted notes, themes, Tor support.
