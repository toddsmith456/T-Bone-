name: Release signing identity diagnostic
on:
  push:
    branches: [arena-release-signing-diagnostic]
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compare public certificate fingerprint with prior release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.keystore"
          chmod 600 "$RUNNER_TEMP/signing.keystore"
          fingerprint=$(keytool -exportcert -keystore "$RUNNER_TEMP/signing.keystore" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)
          expected=0e37601f5716b1476b26a0aed023df97ca8c2ab0c1500cb2d3a7237337f65678
          echo "::notice::Configured signing certificate SHA-256: $fingerprint; v0.5.2 certificate SHA-256: $expected"
          if [ "$fingerprint" != "$expected" ]; then
            echo '::error::The configured signing key does not match the published v0.5.2 APK certificate.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Build release for signing verification diagnosis
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx3g -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvmargs="-Xmx1536m"
        run: ./gradlew :app:assembleRelease --stacktrace --no-configuration-cache
      - name: Diagnose APK verification without publishing
        run: |
          set +e
          APK=app/build/outputs/apk/release/app-release.apk
          TOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$TOOLS" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apkcert.txt" 2>&1
          status=$?
          echo "::notice::apksigner exit: $status"
          python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"apkcert.txt"; print("::notice::APK verification output: " + p.read_text().replace("%", "%25").replace("\n", "%0A"))'
          "$(dirname "$TOOLS")/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt" 2>&1
          badgestatus=$?
          echo "::notice::aapt exit: $badgestatus"
          grep '^package:' "$RUNNER_TEMP/badging.txt" | head -1 | sed 's/^/::notice::/'
          grep -i 'Signer #1 certificate SHA-256 digest: 0e37601f5716b1476b26a0aed023df97ca8c2ab0c1500cb2d3a7237337f65678' "$RUNNER_TEMP/apkcert.txt" >/dev/null
          grepstatus=$?
          echo "::notice::signature match exit: $grepstatus"
          test "$status" = 0 && test "$badgestatus" = 0 && test "$grepstatus" = 0
